server.port=${PORT:8080}
spring.application.name=careerpilot-api
# Load a repository-root .env when launched from either the repository or backend directory.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/careerpilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
careerpilot.ai.provider=${CAREERPILOT_AI_PROVIDER:demo}
careerpilot.ai.openai-api-key=${OPENAI_API_KEY:${CAREERPILOT_AI_API_KEY:}}
careerpilot.ai.agentrouter-api-key=${CODEX_GATEWAY_API_KEY:${AGENTROUTER_API_KEY:}}
careerpilot.ai.groq-api-key=${GROQ_API_KEY:}
careerpilot.ai.model=${OPENAI_MODEL:${CAREERPILOT_AI_MODEL:openai/gpt-oss-20b}}
careerpilot.ai.base-url=${CAREERPILOT_AI_BASE_URL:https://api.groq.com/openai/v1}


server.servlet.session.timeout=30m
careerpilot.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
careerpilot.mail.enabled=${MAIL_ENABLED:false}
careerpilot.mail.from=${MAIL_FROM:}
careerpilot.frontend-url=${CAREERPILOT_FRONTEND_URL:http://localhost:5173}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

